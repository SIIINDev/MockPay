version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: mockpay-postgres
    restart: always
    environment:
      POSTGRES_USER: mockpay
      POSTGRES_PASSWORD: mockpay
      POSTGRES_DB: mockpay
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka
    container_name: mockpay-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper


volumes:
  pgdata:
